# The checks every pull request and main have to pass.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  # The one status that branch protection requires. A job whose dependency
  # failed is skipped, and a skipped check counts as passed, hence always().
  check:
    if: always()
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
